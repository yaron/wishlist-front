name: CI

# Builds the site and runs the API tests on every pull request.

on:
  pull_request:
    branches:
      - azure

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Build and test
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
      - name: Build the site
        run: |
          npm ci
          node scripts/configure-instance.mjs lijst
          npm run build
      - name: Test the API
        working-directory: api
        run: |
          npm ci
          npm test
