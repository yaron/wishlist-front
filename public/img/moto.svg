<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
	<!--
		Moto theme illustration: a blue fully faired early-90s sport bike (side view) with
		louvred side panels and a pink pinstripe, plus circuit traces and a shield.
	-->
	<defs>
		<linearGradient id="speed" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="250" y2="0">
			<stop offset="0" stop-color="#1d4ed8" stop-opacity="0" />
			<stop offset="1" stop-color="#1d4ed8" stop-opacity=".55" />
		</linearGradient>
		<linearGradient id="paint" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#4a6fd0" />
			<stop offset=".45" stop-color="#2d4fa8" />
			<stop offset="1" stop-color="#1c3580" />
		</linearGradient>
		<linearGradient id="paint-dark" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#2a479a" />
			<stop offset="1" stop-color="#172c6a" />
		</linearGradient>
		<linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#f4f6f9" />
			<stop offset=".45" stop-color="#c3c9d2" />
			<stop offset="1" stop-color="#7f8895" />
		</linearGradient>
		<linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#c9d6ee" stop-opacity=".9" />
			<stop offset="1" stop-color="#6f86b8" stop-opacity=".85" />
		</linearGradient>
		<g id="rim">
			<circle r="94" fill="#1d2129" />
			<circle r="80" fill="none" stroke="#2c323d" stroke-width="3" />
			<circle r="70" fill="#f4f6f9" />
			<circle r="70" fill="none" stroke="#a8afba" stroke-width="7" />
			<g fill="#a8afba">
				<path d="M-7 -64 L7 -64 L5 -14 L-5 -14 Z" />
				<path d="M-7 -64 L7 -64 L5 -14 L-5 -14 Z" transform="rotate(120)" />
				<path d="M-7 -64 L7 -64 L5 -14 L-5 -14 Z" transform="rotate(240)" />
			</g>
		</g>
	</defs>

	<!-- circuit traces -->
	<g fill="none" stroke="#c7d3e6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
		<path d="M1000 300 H880 L840 340 V380" />
		<path d="M1000 360 H920 L890 390 V430" />
		<path d="M560 140 V210 L600 250 H680 L720 290" />
		<path d="M400 250 H480 L520 290 V340" />
	</g>
	<g fill="#ffffff" stroke="#a9bad3" stroke-width="3">
		<circle cx="840" cy="380" r="7" />
		<circle cx="890" cy="430" r="7" />
		<circle cx="720" cy="290" r="7" />
		<circle cx="520" cy="340" r="7" />
		<circle cx="400" cy="250" r="7" />
	</g>
	<circle cx="560" cy="140" r="7" fill="#1d4ed8" />

	<!-- shield with a keyhole -->
	<g transform="translate(860 170)">
		<path d="M0 -70 L58 -48 V2 C58 42 30 66 0 80 C-30 66 -58 42 -58 2 V-48 Z" fill="#ffffff" stroke="#1d4ed8" stroke-width="5" stroke-linejoin="round" />
		<circle cy="-4" r="13" fill="#1d4ed8" />
		<path d="M-6 4 L-10 34 H10 L6 4 Z" fill="#1d4ed8" />
	</g>

	<!-- speed lines -->
	<g stroke="url(#speed)" stroke-width="4" stroke-linecap="round">
		<path d="M40 560 H200" />
		<path d="M90 610 H220" />
		<path d="M20 660 H180" />
	</g>

	<!-- shadow -->
	<ellipse cx="520" cy="832" rx="340" ry="12" fill="#0f1b2d" opacity=".1" />

	<g stroke-linejoin="round" stroke-linecap="round">
		<!-- rear wheel with disc -->
		<use href="#rim" x="300" y="738" />
		<circle cx="300" cy="738" r="34" fill="none" stroke="#6b7280" stroke-width="6" />
		<circle cx="300" cy="738" r="12" fill="#5b6678" />

		<!-- swingarm, frame and footpeg -->
		<path d="M300 738 L488 684" stroke="#8d949e" stroke-width="20" />
		<path d="M300 738 L488 684" stroke="#c3c9d2" stroke-width="6" />
		<path d="M470 650 L520 640 L528 700 L486 706 Z" fill="#a8afba" />
		<circle cx="486" cy="686" r="10" fill="#6b7280" />
		<path d="M510 700 L556 704" stroke="#3a404d" stroke-width="7" />
		<path d="M500 770 L478 812" stroke="#3a404d" stroke-width="6" />

		<!-- exhaust: link pipe and silencer rising to the rear -->
		<path d="M640 760 C580 770 520 760 450 712" fill="none" stroke="url(#chrome)" stroke-width="16" />
		<g transform="rotate(-22 340 650)">
			<rect x="236" y="628" width="210" height="46" rx="20" fill="url(#chrome)" stroke="#8d949e" stroke-width="2" />
			<rect x="430" y="636" width="40" height="30" rx="8" fill="url(#chrome)" />
			<ellipse cx="240" cy="651" rx="9" ry="21" fill="#9aa1ab" />
			<ellipse cx="240" cy="651" rx="4" ry="10" fill="#4a5160" />
		</g>

		<!-- tail cowl with stripe, under-tail, indicator and grab rail -->
		<path d="M560 556 L420 548 C360 540 290 520 222 486 C214 496 214 510 222 520 C290 560 380 586 470 600 L560 604 Z" fill="url(#paint)" />
		<path d="M236 512 C300 546 390 572 470 584 L540 590" fill="none" stroke="#c2408e" stroke-width="3.5" />
		<path d="M222 520 C250 540 280 556 310 566 L300 590 C270 576 244 556 228 540 Z" fill="#1f2733" />
		<path d="M214 520 L198 524 L200 538 L218 532 Z" fill="#ff8a1f" />
		<path d="M300 512 C320 494 350 492 370 506" fill="none" stroke="#2a2f3a" stroke-width="7" />

		<!-- side cover under the seat, joining the tail to the fairing -->
		<path d="M566 598 L470 596 C430 592 400 586 372 578 L378 600 C420 618 470 632 528 642 Z" fill="url(#paint-dark)" />
		<!-- seats: rider and passenger -->
		<path d="M590 548 C550 552 500 552 452 540 C430 534 410 520 398 508 C380 504 334 500 300 504 C296 512 300 520 312 524 C360 530 400 540 430 552 C480 566 540 570 590 566 Z" fill="#4b5160" />
		<path d="M398 508 C380 504 334 500 300 504 C304 498 340 492 392 500 Z" fill="#5d6474" />

		<!-- tank -->
		<path d="M580 560 C596 512 650 482 720 478 C752 478 770 488 776 500 L740 560 Z" fill="url(#paint)" />
		<path d="M612 528 C640 506 680 494 720 492" fill="none" stroke="#ffffff" stroke-width="4" opacity=".45" />
		<path d="M598 548 C612 524 636 510 664 506 C650 524 640 540 636 556 Z" fill="#8fa7dd" opacity=".55" />

		<!-- front wheel with gold-carrier discs, fork and fender -->
		<use href="#rim" x="745" y="738" />
		<circle cx="745" cy="738" r="48" fill="none" stroke="#9aa1ab" stroke-width="12" />
		<circle cx="745" cy="738" r="30" fill="none" stroke="#d1aa4e" stroke-width="10" />
		<g fill="#ffffff" opacity=".7">
			<circle cx="745" cy="694" r="3" /><circle cx="789" cy="738" r="3" /><circle cx="745" cy="782" r="3" /><circle cx="701" cy="738" r="3" />
		</g>
		<circle cx="745" cy="738" r="12" fill="#5b6678" />
		<path d="M716 600 L745 738" stroke="url(#chrome)" stroke-width="18" />
		<path d="M732 690 L752 690 L756 724 L740 728 Z" fill="#3a404d" />
		<path d="M680 666 C716 640 780 640 810 668 L800 676 C774 660 724 660 694 676 Z" fill="url(#paint)" />

		<!-- full fairing in one piece: nose, side panels and belly pan -->
		<path d="M720 478 C752 468 780 456 800 446 C818 480 832 520 838 556 C836 574 822 590 802 598 L776 608 C752 626 730 656 716 700 L700 770 C640 800 540 806 450 796 C436 790 434 776 446 766 L540 600 C600 572 670 530 720 478 Z" fill="url(#paint)" />
		<path d="M450 796 C540 806 640 800 700 770 L696 786 C640 812 540 816 446 806 Z" fill="url(#paint-dark)" />
		<path d="M684 516 C714 556 742 584 772 606" fill="none" stroke="#1c3580" stroke-width="2.5" opacity=".7" />
		<path d="M730 484 C758 474 780 466 798 458" fill="none" stroke="#ffffff" stroke-width="4" opacity=".4" />
		<!-- windscreen -->
		<path d="M717 474 C735 440 757 410 781 392 C793 410 801 428 803 446 C775 452 745 464 717 474 Z" fill="url(#screen)" />
		<!-- headlight -->
		<path d="M814 518 L834 540 L837 566 L814 556 Z" fill="#eef2f8" stroke="#1c3580" stroke-width="3" />
		<path d="M819 528 L831 542" stroke="#ffffff" stroke-width="3" />
		<!-- front indicator -->
		<path d="M754 556 L778 552 L780 568 L756 570 Z" fill="#ff8a1f" />
		<!-- mirror -->
		<path d="M772 452 L772 414" stroke="#1f2733" stroke-width="5" />
		<path d="M752 388 C760 378 788 378 794 388 L790 414 C778 420 760 418 754 412 Z" fill="#1f2733" />
		<!-- louvred side panels: two groups of slanted vents -->
		<g fill="#1a2140">
			<path d="M632 586 L704 572 L700 584 L628 598 Z" />
			<path d="M626 604 L706 588 L702 600 L622 616 Z" />
			<path d="M620 622 L706 604 L702 616 L616 634 Z" />
			<path d="M614 640 L698 622 L692 634 L610 652 Z" />
			<path d="M530 660 L592 648 L588 660 L526 672 Z" />
			<path d="M524 678 L594 664 L590 676 L520 690 Z" />
			<path d="M518 696 L594 680 L590 692 L514 708 Z" />
			<path d="M512 714 L588 698 L584 710 L508 726 Z" />
		</g>
		<g stroke="#6f8fdc" stroke-width="2" opacity=".7">
			<path d="M628 598 L700 584 M622 616 L702 600 M616 634 L702 616 M610 652 L692 634" />
			<path d="M526 672 L588 660 M520 690 L590 676 M514 708 L590 692 M508 726 L584 710" />
		</g>
		<!-- pink pinstripe along the lower fairing -->
		<path d="M462 776 C560 752 680 696 766 630" fill="none" stroke="#c2408e" stroke-width="4" />
	</g>
</svg>
